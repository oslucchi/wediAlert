# wediAlert phone numbers. Copy this file to contacts.<env>.properties (contacts.prod.properties on
# the Pi, in /etc/wedialert next to site.prod.properties) and put the real numbers there.
# contacts.*.properties is ignored by git: only this example is in the repository.

# Who gets the fault and fire alarm SMS: mobile numbers, international format, separated by ';'
contacts=+39XXXXXXXXXX;+39XXXXXXXXXX

# Optional: who gets the periodic test SMS (default: the first contact only; all = every contact)
#heartbeat.contacts=+39XXXXXXXXXX
