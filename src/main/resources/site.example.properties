# wediAlert site configuration (example: copy to site.prod.properties and set the real numbers).
# Mobile numbers, international format, separated by ';'
contacts=+390000000001;+390000000002
# CPU temperatures (C) where the fan steps to 25%, 50%, 75%, 100%
fanTempSetPoints=46.5, 47.5, 49, 52
# Periodic test SMS (empty = off): days of the week, local time, window in minutes
heartbeat.days=MONDAY
heartbeat.time=10:00
heartbeat.windowMinutes=60
# Optional: who gets the test SMS (default: first contact only; all = every contact)
#heartbeat.contacts=+390000000001
# Optional: a test SMS is sent when this file appears (sudo wedialert-test-sms)
test.triggerFile=/run/wedialert/send-test
